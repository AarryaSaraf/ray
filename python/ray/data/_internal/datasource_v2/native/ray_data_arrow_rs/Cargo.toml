[package]
name = "ray_data_arrow_rs"
version = "0.1.0"
edition = "2021"
description = "Experimental arrow-rs Parquet reader for Ray Data (prototype)"

[lib]
name = "ray_data_arrow_rs"
# cdylib for the Python extension module; rlib so the logic can be unit-tested
# from Rust too.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pin to the same major the surviving standalone benchmark used, so behavior
# matches the numbers in Agents.md. object_store MUST match the version parquet
# pins (0.13.x) or ParquetObjectReader's API won't line up.
parquet = { version = "59", features = ["arrow", "async", "object_store"] }
# Only the `ffi` feature — we hand batches to Python via the Arrow C-stream
# (FFI_ArrowArrayStream + PyCapsule), NOT arrow's `pyarrow` conversions. Pulling
# `pyarrow` would drag in arrow-pyarrow → pyo3 0.28, conflicting with our pyo3 0.22.
arrow = { version = "59", features = ["ffi"] }
object_store = { version = "0.13", features = ["aws"] }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
anyhow = "1"

# --------------------------------------------------------------------------- #
# Allocator A/B (memory parity on Linux).
#
# The default build uses the system allocator (glibc ptmalloc on Linux). Under a
# multi-threaded decode (tokio workers + K decode threads) ptmalloc spins up many
# per-thread arenas that RETAIN freed chunks, so node-summed peak RSS looks worse
# than PyArrow's even when our true working set is smaller (Agents.md §7.8, the
# rg_50k finding). PyArrow bundles jemalloc with page decay, so it releases.
#
# Two levers, both validated on the Linux run (neither testable on macOS):
#   * `--features jemalloc`  — swap the global allocator to jemalloc (the SAME
#     allocator PyArrow uses → a fair fight), tuned for prompt page release via
#     `_RJEM_MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000`.
#     Preferred over mimalloc, which segfaulted the workers when used as the
#     cdylib global allocator across the Arrow C-stream FFI boundary (§7.8).
#   * default build + `MALLOC_ARENA_MAX=2` in the worker env — caps ptmalloc
#     arenas, the no-code, zero-segfault-risk baseline (set by the harness).
# --------------------------------------------------------------------------- #
[features]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies.mimalloc]
version = "0.1"
optional = true

[dependencies.tikv-jemallocator]
version = "0.6"
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
